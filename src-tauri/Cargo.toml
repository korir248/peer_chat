[package]
name = "peerchat"
version = "0.1.0"
description = "Medi p2p app"
authors = ["Eugene Korir"]
edition = "2021"

[lib]
name = "peerchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.102"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

# node crate
p2p-node = { git = "https://github.com/korir248/p2p_node.git", branch = "main" }
