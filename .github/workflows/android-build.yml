name: Android Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend deps
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
            # Download and install Android command line tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk
            mkdir -p $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools $HOME/android-sdk/cmdline-tools/latest || true
            mv $HOME/android-sdk/cmdline-tools/latest $HOME/android-sdk/cmdline-tools/latest || true
            
            # Set paths
            echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
            
            # Accept licenses non-interactively
            yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
            
            # Install required packages
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" > /dev/null 2>&1
            
            echo "Android SDK setup complete"

      - name: Add Android Rust targets
        run: |
            rustup target add aarch64-linux-android
            rustup target add armv7-linux-androideabi
            rustup target add x86_64-linux-android

      - name: Configure private repo access
        env:
          NODE_TOKEN: ${{ secrets.NODE_TOKEN }}
        run: |
          git config --global url."https://${{ secrets.NODE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Initialize Android project
        run: cargo tauri android init

      - name: Build Android APK
        run: cargo tauri android build --apk

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: "peerChat - ${{ github.event.inputs.version }}"
          tag_name: "android-${{ github.event.inputs.version }}-${{ github.run_id }}"
          draft: true  
          prerelease: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
